<!doctype html><html lang="de"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Stream-Overlay · Beispieldaten</title><style>:root{--navy:#052148;--green:#7cb522}*{box-sizing:border-box}.overlay-page{margin:0;padding:0;background:transparent!important;color:var(--navy);font-family:Arial,Helvetica,sans-serif;overflow:hidden}.overlay-panel{width:min(900px,100vw);border-radius:10px;overflow:hidden;border-left:6px solid var(--green);background:#f4f6f9}.overlay-top{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px;background:var(--navy);color:white;padding:9px 16px;font-size:12px;min-height:34px}.overlay-top strong{font-size:13px}.overlay-status{justify-self:end;font-weight:700;font-size:10px;color:#ced8e6}.overlay-status.live{color:#b8e56f}.overlay-head,.overlay-row{display:grid;grid-template-columns:minmax(0,1fr) 90px 110px;align-items:center;text-align:center}.overlay-head{font-size:10px;color:#61738c;padding:5px 16px 3px;background:white;text-transform:uppercase;letter-spacing:1px}.overlay-head span:first-child{text-align:left}.overlay-row{padding:3px 16px;min-height:55px;border-bottom:1px solid #dce3ec}.overlay-team{text-align:left;font-size:21px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding-right:10px}.overlay-sets{font-size:26px}.overlay-points{font-size:35px;line-height:1.2;background:#e6efd9;border-radius:5px}.overlay-bottom{display:flex;justify-content:space-between;padding:5px 16px;font-size:9px;color:#63758c;background:white;min-height:20px}.disconnected .overlay-bottom{background:#fff2d9;color:#765314}.overlay-message{padding:24px 16px;font-size:15px;background:#f4f6f9;color:var(--navy)}
.setup-page{margin:0;background:#f4f6f9;color:var(--navy);font:15px Arial,Helvetica,sans-serif}.setup-main{max-width:1000px;margin:auto;padding:30px 24px}.setup-back{color:#61738c;text-decoration:none;font-size:13px}.setup-main h1{font-size:30px;margin:25px 0 12px}.setup-main p,.setup-main li{line-height:1.7}.setup-note{font-size:13px;color:#60728b}.preview-grid{padding:25px 15px;background-color:#e0e5ec;background-image:linear-gradient(45deg,#d0d7e1 25%,transparent 25%),linear-gradient(-45deg,#d0d7e1 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#d0d7e1 75%),linear-gradient(-45deg,transparent 75%,#d0d7e1 75%);background-size:20px 20px;background-position:0 0,0 10px,10px -10px,-10px 0;border-radius:12px;margin:20px 0;overflow:auto}.preview-grid iframe{display:block;width:900px;height:220px;border:0;background:transparent}.url-controls{display:flex;gap:10px;margin-top:10px}.url-controls input{min-width:0;flex:1;padding:12px;border:1px solid #cbd6e3;border-radius:7px;color:var(--navy);background:white;font:12px monospace}.setup-page button,.open-overlay{padding:12px 16px;border:0;border-radius:7px;color:white;background:var(--navy);font-weight:bold;cursor:pointer}.open-overlay{display:inline-block;text-decoration:none;margin-top:12px;font-size:12px}.setup-help{background:white;padding:18px 24px;border:1px solid #dce3ec;border-radius:10px;margin-top:24px}.setup-help h2{font-size:18px;margin-top:0}.setup-help ol{padding-left:20px}.setup-page a:focus-visible,.setup-page button:focus-visible,.setup-page input:focus-visible{outline:3px solid var(--green);outline-offset:3px}@media(max-width:600px){.overlay-top{font-size:10px;padding:8px 10px;gap:6px}.overlay-top strong{font-size:11px}.overlay-head,.overlay-row{grid-template-columns:minmax(0,1fr) 55px 65px;padding-left:10px;padding-right:10px}.overlay-team{font-size:16px}.overlay-points{font-size:30px}.overlay-sets{font-size:23px}.setup-main{padding:24px 16px}.url-controls{flex-direction:column}}

.serve-indicator{display:inline-flex;vertical-align:middle;margin-left:9px;line-height:1}.serve-indicator svg{display:block}
body{margin:0;padding:30px;background:#e7ebf0;font-family:Arial,sans-serif;color:#052148}.demo{max-width:950px;margin:auto}.demo p{font-size:13px;margin:0 0 20px}.stage{padding:20px;background-color:#dce3eb;background-image:linear-gradient(45deg,#cbd4df 25%,transparent 25%),linear-gradient(-45deg,#cbd4df 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#cbd4df 75%),linear-gradient(-45deg,transparent 75%,#cbd4df 75%);background-size:20px 20px;background-position:0 0,0 10px,10px -10px,-10px 0;border-radius:14px}.overlay-panel{max-width:100%}</style><div class="demo"><p>VORSCHAU · Erfundene Beispieldaten · Das Schachbrett zeigt den transparenten Hintergrund.</p><div class="stage"><section class="overlay-panel"><div class="overlay-head"><span>Mannschaft</span><span>Sätze</span><span>Punkte</span></div><div class="overlay-row"><strong class="overlay-team">Kühlungsborner VV 95</strong><strong class="overlay-sets">1</strong><strong class="overlay-points">18</strong></div><div class="overlay-row"><strong class="overlay-team">VfB Malchow<span class="serve-indicator" role="img" aria-label="Aufschlag" title="Aufschlag"><svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="10" fill="white" stroke="#052148" stroke-width="1.5"/><path d="M12 2c-3 3-4 6-3 10m0 0c4 0 8 2 11 6M9 12c-1 4-1 7 1 10M4 6c3 0 5 1 7 3m-8 7c2-2 4-3 6-4m7-9c0 4-1 7-3 10m9-3c-3 1-6 1-8 0M5 20c0-3 1-5 3-7" fill="none" stroke="#052148" stroke-width="1.1" stroke-linecap="round"/></svg></span></strong><strong class="overlay-sets">1</strong><strong class="overlay-points">16</strong></div><div class="overlay-bottom"><span>Quelle: VMV / SAMS</span><span id="overlay-connection">Beispieldaten</span></div></section></div></div></html>
