name: Spielplan-Ergebnisse abgleichen
on:
  schedule:
    - cron: '17 7-22 * * 0,6'
  workflow_dispatch:
permissions:
  contents: read
  issues: write
concurrency:
  group: spielplan-ergebnisse
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
      UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/sync-results.mjs

      - name: Sicherungsfehler melden oder Entwarnung geben
        if: ${{ always() }}
        uses: actions/github-script@v7
        env:
          SYNC_STATUS: ${{ job.status }}
        with:
          script: |
            const title = 'Fan-Ticker: Ergebnissicherung fehlgeschlagen';
            const {owner, repo} = context.repo;
            const issues = await github.paginate(github.rest.issues.listForRepo, {owner, repo, state: 'open', creator: 'github-actions[bot]', per_page: 100});
            const issue = issues.find(i => !i.pull_request && i.title === title);
            const run = `https://github.com/${owner}/${repo}/actions/runs/${context.runId}`;
            if (process.env.SYNC_STATUS !== 'success') {
              if (!issue) await github.rest.issues.create({owner, repo, title, body: `Die automatische Übernahme der VMV-Ergebnisse ist fehlgeschlagen. Bereits gespeicherte Ergebnisse bleiben erhalten. Bitte den [Sicherungslauf prüfen](${run}) und gegebenenfalls erneut starten. Dieser Hinweis wird nach einem erfolgreichen Lauf automatisch geschlossen.`});
              core.summary.addHeading('Ergebnissicherung fehlgeschlagen').addLink('Sicherungslauf prüfen', run);
            } else {
              if (issue) await github.rest.issues.update({owner, repo, issue_number: issue.number, state: 'closed', state_reason: 'completed'});
              core.summary.addHeading('Ergebnissicherung erfolgreich');
            }
            await core.summary.write();
