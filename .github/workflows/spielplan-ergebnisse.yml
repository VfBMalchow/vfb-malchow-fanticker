name: Spielplan-Ergebnisse abgleichen
on:
  schedule:
    - cron: '17 7-22 * * 0,6'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: spielplan-ergebnisse
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
      UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/sync-results.mjs
