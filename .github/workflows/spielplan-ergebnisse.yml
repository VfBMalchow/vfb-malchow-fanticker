name: Spielplan-Ergebnisse abgleichen
on:
  schedule:
    - cron: '17 7-22 * * 0,6'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: spielplan-ergebnisse
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/sync-results.mjs
      - name: Geänderte Ergebnisse speichern
        run: |
          if git diff --quiet -- public/spielplan.json; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/spielplan.json
          git commit -m "Spielplan: abgeschlossene VfB-Ergebnisse übernehmen"
          git push
